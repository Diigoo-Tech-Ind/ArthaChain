[workspace]
members = [
  "blockchain_node",
  "services/ai-jobd"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "1.3"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1.5"
aes-gcm = "0.10"
hmac = "0.12"
argon2 = "0.5"
zeroize = "1.7"
secp256k1 = "0.29"
bulletproofs = "4.0"
merlin = "3.0"
arrayref = "0.3"
brotli = "6.0"
lz4_flex = "0.11"
flate2 = "1.0"
num-bigint = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1.5"
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
rayon = "1.10"
num_cpus = "1.16"
bumpalo = "3.15"
sysinfo = "0.33"
tiny-keccak = "2.0"
lazy_static = "1.5"
socket2 = "0.5"
memmap2 = "0.9"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
# Security: Updated from 0.12 due to deprecated hyper dependency
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
ethereum-types = "0.14"
prometheus = "0.14"
criterion = "0.5"
proptest = "1.4"
hickory-resolver = "0.24"
ndarray = "0.15"
ndarray-rand = "0.14"
protobuf = ">=3.7.2"
# libp2p with MINIMAL features to ELIMINATE ring 0.16.20 vulnerability
# EXCLUDED: "quic" (depends on ring via rcgen), "tls" (depends on ring)
# Using "noise" for encryption (ring-free), "tcp" for transport
libp2p = { version = "0.54", default-features = false, features = [
    "tcp",           # TCP transport (no ring dependency)
    "tokio",         # Async runtime
    "noise",         # Encryption (Noise protocol, ring-free)
    "yamux",         # Multiplexing
    "gossipsub",     # Pub-sub messaging
    "kad",           # DHT
    "identify",      # Peer identification
    "mdns",          # Local peer discovery
    "ping",          # Ping protocol
    "request-response",  # Request-response protocol
    "macros"         # Convenience macros
] }
# NOTE: TLS and QUIC intentionally excluded - these bring ring 0.16.20
# Noise protocol provides equivalent security without vulnerable dependencies

# Note: Upgraded parking_lot from 0.11 to 0.12 to address 'instant' unmaintained dependency warning
parking_lot = "0.12"

# The following dependencies have been reviewed for security:
# - hyper: Migrated from 0.14 (unmaintained) to 1.0+ via reqwest 0.12
# - rustls upgraded to compatible version via reqwest/libp2p updates
# All known security advisories have been addressed where possible

# Security updates
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "ansi"] }  # Fix RUSTSEC-2025-0055

# Replacements for unmaintained dependencies
educe = "0.6"  # Replacement for derivative
rustc-hash = "2.0"  # Replacement for fxhash
# Note: instant is transitive via parking_lot, already upgraded to 0.12.3
# Note: json5 is transitive via config, using config 0.14 which may have fixes
# Note: net2 deprecated, using socket2 directly (already in workspace)
# Note: paste may be unmaintained but widely used, monitor for alternatives

# SECURITY STATUS:
# - ring 0.16.20 (RUSTSEC-2025-0009): Medium severity AES panic vulnerability
#   Via: libp2p-quic (P2P) and ethers (EVM)
#   Status: Cannot patch (requires git repo/path patches, not crate.io)
#   Risk: LOW for testnet - overflow checking panic unlikely in normal operations
#   Action: Monitor upstream libp2p/ethers for updates
#
# - tracing-subscriber 0.2.25 (RUSTSEC-2025-0055): Low severity log poisoning
#   Via: ark-relations (ZK-SNARK)
#   Status: Locked by arkworks dependency
#   Risk: VERY LOW for testnet - ANSI escape sequences in logs
#   Action: Monitor upstream arkworks for updates
#
# Both vulnerabilities are acceptable for TESTNET launch
# MUST be resolved before MAINNET via dependency updates or code removal

[profile.release]
lto = false
codegen-units = 16
strip = true
panic = "abort"

