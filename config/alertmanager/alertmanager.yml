global:
  resolve_timeout: 5m
  slack_api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'  # Replace with actual webhook
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@arthachain.io'
  smtp_auth_username: 'YOUR_EMAIL_HERE'
  smtp_auth_password: 'YOUR_PASSWORD_HERE'
  smtp_require_tls: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  
  routes:
    # Critical alerts go to multiple channels
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
    
    # Info alerts
    - match:
        severity: info
      receiver: 'info-alerts'

# Receivers configuration
receivers:
  - name: 'default'
    slack_configs:
      - channel: '#arthachain-alerts'
        title: 'ArthaChain Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'critical-alerts'
    slack_configs:
      - channel: '#arthachain-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'
    email_configs:
      - to: 'ops-team@arthachain.io'
        subject: '[CRITICAL] ArthaChain Alert: {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}<p>{{ .Annotations.description }}</p>{{ end }}'
        send_resolved: true

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#arthachain-warnings'
        title: '⚠️  WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'

  - name: 'info-alerts'
    slack_configs:
      - channel: '#arthachain-info'
        title: 'ℹ️  INFO: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'good'

# Inhibition rules - prevent noise
inhibit_rules:
  # If NodeDown fires, inhibit all other alerts for that instance
  - source_match:
      severity: 'critical'
      alertname: 'NodeDown'
    target_match:
      severity: 'warning'
    equal: ['instance']
  
  # If critical disk space alert fires, inhibit warning disk space
  - source_match:
      alertname: 'CriticalDiskSpace'
    target_match:
      alertname: 'LowDiskSpace'
    equal: ['instance', 'mountpoint']
