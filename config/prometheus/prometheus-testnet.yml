# ArthaChain Testnet Local Prometheus Configuration
# For standalone testnet monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    monitor: 'arthachain-testnet'
    environment: 'testnet'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Local Testnet Node Metrics
  - job_name: 'arthachain-testnet'
    static_configs:
      - targets: ['host.docker.internal:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'testnet-validator'
