# ArthaChain Prometheus Configuration
# Metrics scraping configuration for all ArthaChain services

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    monitor: 'arthachain-monitor'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (optional)
# rule_files:
#   - "alerts.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Validator Node Metrics
  - job_name: 'validator-node'
    static_configs:
      - targets: ['validator-node:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'validator-node'

  # RPC Service Metrics
  - job_name: 'rpc-service'
    static_configs:
      - targets: ['rpc-service:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'rpc-service'

  # Sentry Node Metrics
  - job_name: 'sentry-node'
    static_configs:
      - targets: ['sentry-node:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'sentry-node'

  # API Gateway Metrics (if available)
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api-gateway'

  # WebSocket RPC Metrics
  - job_name: 'websocket-rpc'
    static_configs:
      - targets: ['websocket-rpc:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'websocket-rpc'

  # P2P Network Metrics
  - job_name: 'p2p-network'
    static_configs:
      - targets: ['p2p-network:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'p2p-network'

  # Storage Node Metrics
  - job_name: 'storage-node'
    static_configs:
      - targets: ['storage-node:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'storage-node'

  # gRPC Server Metrics
  - job_name: 'grpc-server'
    static_configs:
      - targets: ['grpc-server:9184']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'grpc-server'
