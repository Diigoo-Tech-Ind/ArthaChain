[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arthapy"
version = "1.0.0"
description = "Python SDK for ArthaChain - Identity, Storage, and AI Cloud Platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ArthaChain", email = "dev@arthachain.in"}
]
keywords = ["blockchain", "identity", "storage", "ai", "arthachain", "web3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://arthachain.in"
Documentation = "https://docs.arthachain.in"
Repository = "https://github.com/ArthaChain/arthapy"
Issues = "https://github.com/ArthaChain/arthapy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["arthapy*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
